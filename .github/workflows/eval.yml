name: eval

# Tag pushes point at commits main has already built, so an unfiltered trigger
# runs identical bytes twice. Branch pushes and pull requests cover every
# change exactly once.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-suite:
    name: frozen suite (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Compile every script
        run: python -m compileall -q scripts evals/governance-cases
      - name: Run the frozen suite twice and require byte-identical results
        run: |
          # Results go outside the tree: run_eval hashes the whole skill tree as the subject.
          python -B scripts/run_eval.py > "$RUNNER_TEMP/result-1.json"
          python -B scripts/run_eval.py > "$RUNNER_TEMP/result-2.json"
          cmp "$RUNNER_TEMP/result-1.json" "$RUNNER_TEMP/result-2.json"
          python - <<'PY'
          import json, os
          r = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "result-1.json")))
          assert r["status"] == "passed", r
          print("identity", r["identity"]["sha256"], "subject", r["subject"]["sha256"])
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: result-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/result-1.json

  cross-platform-identity:
    name: results identical across OS and Python
    needs: frozen-suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: results
      - name: Every result file must be byte-identical
        run: |
          ls -R results
          first=$(ls results/*/result-1.json | head -n 1)
          for f in results/*/result-1.json; do cmp "$first" "$f"; done
          echo "all results byte-identical"
